# Git hooks (lefthook). Installed automatically by `npm install` (prepare
# script). Fast local gates only - CI (.github/workflows/test.yml) remains
# the authoritative check with the full suite + coverage thresholds.
#
# Escape hatches: `git commit --no-verify` / `LEFTHOOK=0 git push` for a
# one-off skip; personal tweaks go in lefthook-local.yml (gitignored).
# Conventions are documented in CONTRIBUTING.md.

min_version: 2.0.0

pre-commit:
  parallel: true
  # Nothing to check on merge/rebase replays - the commits already passed.
  skip:
    - merge
    - rebase
  commands:
    # Biome runs per config root (repo root and apps/api are separate Biome
    # roots - a single root-invoked run on files from both errors with
    # "nested root configuration", same reason the npm scripts split them).
    biome:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json}'
      exclude:
        - apps/api/**
      # format (not check) - mirrors check-code; ESLint owns linting here
      run: npx biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    biome-api:
      root: 'apps/api/'
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json}'
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    eslint:
      # Flat config ignores apps/api etc.; --no-warn-ignored keeps staged
      # files from ignored paths silent instead of counting as warnings.
      glob: '*.{ts,tsx}'
      run: npx eslint --no-warn-ignored --max-warnings=0 {staged_files}
    diagrams:
      # docs/diagrams/README.md + dist/*.svg are generated; re-render +
      # reassemble + stage whenever a diagram source (or the assembler) is
      # committed. CI still drift-checks the page and SVG presence/pairing.
      glob: '{docs/diagrams/src/*.mmd,scripts/assemble-diagrams.mjs}'
      run: make diagrams && git add docs/diagrams/README.md docs/diagrams/dist/*.svg

commit-msg:
  commands:
    # Conventional Commits - rules in commitlint.config.mjs; CI re-checks
    # the PR's commits and title so --no-verify can't slip one past.
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    typecheck:
      run: npm run typecheck

# Keep node_modules in step with the lockfile after pulls and branch
# switches, so the hooks above never run against a stale install.
post-merge:
  commands:
    install:
      glob: 'package-lock.json'
      run: npm ci
post-checkout:
  commands:
    install:
      # $3 == 1 for branch checkouts (0 for file checkouts)
      run: |
        [ "{3}" = "1" ] || exit 0
        git diff --quiet {1} {2} -- package-lock.json && exit 0
        npm ci

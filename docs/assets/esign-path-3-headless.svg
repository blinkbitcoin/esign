<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 748" width="400" height="748" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Bring your own UI">
<rect width="400" height="748" fill="#FFFFFF"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#1C2230"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#B8BFC9"/></marker>
</defs>
<text x="20" y="30" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#5B6472">3 · HEADLESS</text>
<text x="20" y="54" font-size="17" font-weight="700" fill="#1C2230">Bring your own UI</text>
<text x="20" y="74" font-size="12" fill="#5B6472">Library keeps only the state machine.</text>
<g transform="translate(110 96)">
<rect x="0" y="0" width="180" height="300" rx="22" fill="#1C2230"/>
<rect x="7" y="7" width="166" height="286" rx="16" fill="#FFFFFF"/>
<rect x="66" y="12" width="48" height="6" rx="3" fill="#1C2230"/>
<rect x="20" y="34" width="140" height="150" rx="8" fill="#F4F5F7" stroke="#DADEE5"/>
<text x="32" y="56" font-size="9" font-weight="700" fill="#1C2230">Loan agreement</text>
<text x="32" y="70" font-size="8" fill="#666666">3 pages · 2 signatures</text>
<rect x="32" y="84" width="116" height="4" rx="2" fill="#DADEE5"/>
<rect x="32" y="94" width="104" height="4" rx="2" fill="#DADEE5"/>
<rect x="32" y="104" width="112" height="4" rx="2" fill="#DADEE5"/>
<rect x="32" y="114" width="90" height="4" rx="2" fill="#DADEE5"/>
<rect x="32" y="124" width="116" height="4" rx="2" fill="#DADEE5"/>
<rect x="32" y="134" width="70" height="4" rx="2" fill="#DADEE5"/>
<text x="32" y="170" font-size="8" fill="#F7931A">Read the full document ›</text>
<rect x="20" y="232" width="140" height="30" rx="15" fill="#F7931A"/>
<text x="90" y="251" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sign with our own button</text>
<text x="90" y="280" font-size="9.5" fill="#F7931A" text-anchor="middle">Not now</text>
</g>
<rect x="20" y="420" width="360" height="42" rx="4" fill="#FEF4E8" stroke="#F7931A" stroke-width="1.5"/>
<text x="32" y="438" font-size="12.5" font-weight="600" fill="#1C2230">Host app</text>
<text x="32" y="453" font-size="10.5" fill="#5B6472">own buttons, own layout, own copy</text>
<line x1="200" y1="464" x2="200" y2="478" stroke="#1C2230" stroke-width="1" marker-end="url(#a)"/>
<text x="210" y="474" font-size="10" fill="#5B6472">status · sign() · retry() …</text>
<rect x="20" y="480" width="360" height="42" rx="4" fill="none" stroke="#B8BFC9" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="32" y="498" font-size="12.5" font-weight="600" fill="#B8BFC9">ESignature</text>
<text x="32" y="513" font-size="10.5" fill="#5B6472">not used: the host draws the screens</text>
<line x1="200" y1="524" x2="200" y2="538" stroke="#B8BFC9" stroke-width="1" marker-end="url(#g)"/>
<rect x="20" y="540" width="360" height="42" rx="4" fill="#E6F2FF" stroke="#007AFF" stroke-width="1.5"/>
<text x="32" y="558" font-size="12.5" font-weight="600" fill="#1C2230">useESignature</text>
<text x="32" y="573" font-size="10.5" fill="#5B6472">state machine, renders nothing</text>
<line x1="200" y1="584" x2="200" y2="598" stroke="#1C2230" stroke-width="1" marker-end="url(#a)"/>
<text x="210" y="594" font-size="10" fill="#5B6472">webViewProps / embed</text>
<rect x="20" y="600" width="360" height="42" rx="4" fill="#FEF4E8" stroke="#F7931A" stroke-width="1.5"/>
<text x="32" y="618" font-size="12.5" font-weight="600" fill="#1C2230">WebView / iframe</text>
<text x="32" y="633" font-size="10.5" fill="#5B6472">placed by the host, anywhere</text>
<line x1="200" y1="644" x2="200" y2="658" stroke="#1C2230" stroke-width="1" marker-end="url(#a)"/>
<rect x="20" y="660" width="360" height="42" rx="4" fill="#E6F2FF" stroke="#007AFF" stroke-width="1.5"/>
<text x="32" y="678" font-size="12.5" font-weight="600" fill="#1C2230">SigningSource</text>
<text x="32" y="693" font-size="10.5" fill="#5B6472">proxy · Web Forms · public URL</text>

<line x1="20" y1="708" x2="380" y2="708" stroke="#E3E6EB" stroke-width="1"/>
<g transform="translate(20 732)" font-size="10.5" fill="#5B6472">

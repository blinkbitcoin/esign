<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Bring your own UI">
<rect width="400" height="640" fill="#FFFFFF"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#1C2230"/></marker></defs>
<text x="20" y="30" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#5B6472">3 · HEADLESS</text>
<text x="20" y="54" font-size="17" font-weight="700" fill="#1C2230">Bring your own UI</text>
<text x="20" y="74" font-size="12" fill="#5B6472">Library keeps only the state machine.</text>
<g transform="translate(110 96)">
<rect x="0" y="0" width="180" height="300" rx="22" fill="#1C2230"/>
<rect x="7" y="7" width="166" height="286" rx="16" fill="#FFFFFF"/>
<rect x="66" y="12" width="48" height="6" rx="3" fill="#1C2230"/>
<rect x="20" y="34" width="140" height="150" rx="8" fill="#F4F5F7" stroke="#DADEE5"/>
<text x="32" y="56" font-size="9" font-weight="700" fill="#1C2230">Loan agreement</text>
<text x="32" y="70" font-size="8" fill="#666666">3 pages · 2 signatures</text>
<rect x="32" y="84" width="116" height="4" rx="2" fill="#DADEE5"/>
<rect x="32" y="94" width="104" height="4" rx="2" fill="#DADEE5"/>
<rect x="32" y="104" width="112" height="4" rx="2" fill="#DADEE5"/>
<rect x="32" y="114" width="90" height="4" rx="2" fill="#DADEE5"/>
<rect x="32" y="124" width="116" height="4" rx="2" fill="#DADEE5"/>
<rect x="32" y="134" width="70" height="4" rx="2" fill="#DADEE5"/>
<text x="32" y="170" font-size="8" fill="#F7931A">Read the full document ›</text>
<rect x="20" y="232" width="140" height="30" rx="15" fill="#F7931A"/>
<text x="90" y="251" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sign with our own button</text>
<text x="90" y="280" font-size="9.5" fill="#F7931A" text-anchor="middle">Not now</text>
</g>
<rect x="20" y="420" width="360" height="86" rx="4" fill="#FEF4E8" stroke="#F7931A" stroke-width="1.5"/>
<text x="32" y="442" font-size="12.5" font-weight="600" fill="#1C2230">Host app</text>
<text x="368" y="442" font-size="10.5" fill="#5B6472" text-anchor="end">own buttons, layout, copy</text>
<text x="32" y="466" font-size="10.5" fill="#5B6472">reads status · error · isSessionExpired</text>
<text x="32" y="484" font-size="10.5" fill="#5B6472">calls sign · cancel · retry · restart · checkConnection</text>
<line x1="200" y1="506" x2="200" y2="522" stroke="#1C2230" stroke-width="1" marker-end="url(#a)"/>
<rect x="20" y="524" width="360" height="34" rx="4" fill="#E6F2FF" stroke="#007AFF" stroke-width="1.5"/>
<text x="32" y="546" font-size="12.5" font-weight="600" fill="#1C2230">useESignature</text>
<text x="368" y="546" font-size="10.5" fill="#5B6472" text-anchor="end">state machine, renders nothing</text>
<line x1="200" y1="558" x2="200" y2="574" stroke="#1C2230" stroke-width="1" marker-end="url(#a)"/>
<text x="210" y="570" font-size="10" fill="#5B6472">webViewProps / embed</text>
<rect x="20" y="576" width="360" height="34" rx="4" fill="#FEF4E8" stroke="#F7931A" stroke-width="1.5"/>
<text x="32" y="598" font-size="12.5" font-weight="600" fill="#1C2230">WebView / iframe</text>
<text x="368" y="598" font-size="10.5" fill="#5B6472" text-anchor="end">placed by the host, anywhere</text>

<g transform="translate(20 610)" font-size="10.5" fill="#5B6472">
<rect x="0" y="-9" width="14" height="10" rx="2" fill="#E6F2FF" stroke="#007AFF" stroke-width="1.5"/><text x="20" y="0">library owns</text>
<rect x="100" y="-9" width="14" height="10" rx="2" fill="#FEF4E8" stroke="#F7931A" stroke-width="1.5"/><text x="120" y="0">host owns</text>
</g>
</svg>
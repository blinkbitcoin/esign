# Maestro E2E: launch smoke test - the app boots to the signing idle screen.
# Fast-fail signal for broken builds before the longer flows run.
appId: ${APP_ID} # iOS: org.reactjs.native.example.ReactNativeSandbox / Android: com.reactnativesandbox
---
# Whole flow retries once: on CI simulators Maestro's iOS driver sometimes
# reads the terminate->relaunch cycle of launchApp as an app crash (no real
# crash - DiagnosticReports stays empty). Retrying just this flow costs
# seconds; a suite-level rerun costs minutes.
- retry:
    maxRetries: 1
    commands:
      - launchApp
      # This flow runs FIRST (see config.yaml) and absorbs the one-time cold cost
      # of driver install + app boot + bundle load - hence the generous window.
      - extendedWaitUntil:
          visible:
            id: "sign-document-button"
          timeout: 60000

      - assertVisible: "Sign Document"
      - assertVisible:
          id: "cancel-button"

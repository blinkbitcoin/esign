# Maestro E2E: DocuSign Web Forms mode happy path.
# Requires Metro bundled with ESIGN_MODE=webform:
#   ESIGN_MODE=webform npm start
# plus the backend (mock provider) + database running. The demo mints a
# mock-webform instance (real DocuSign event vocabulary) and drives it in the
# WebView.
#
# Runs on its own (tagged, excluded from the default suite), so it owns the
# cold launch - the whole flow is retried as a unit, like app-launch.yaml.
appId: ${APP_ID} # iOS: org.reactjs.native.example.ReactNativeSandbox / Android: com.reactnativesandbox
tags:
  - webform
---
- retry:
    maxRetries: 2
    commands:
      - launchApp
      - extendedWaitUntil:
          visible:
            id: "sign-document-button"
          timeout: 60000
      - tapOn:
          id: "sign-document-button"

      # The mock DocuSign Web Form loads in the real WebView
      - extendedWaitUntil:
          visible:
            id: "signing-webview"
          timeout: 15000
      - extendedWaitUntil:
          visible: "Mock Web Form"
          timeout: 15000

      # Complete signing (posts the real DocuSign 'signingComplete' event)
      - tapOn: "Complete Signing"
      - extendedWaitUntil:
          visible:
            id: "success-screen"
          timeout: 15000
      - extendedWaitUntil:
          visible: "Document signed!.*"
          timeout: 15000
      - tapOn: "OK"

# Maestro workspace config.
#
# app-launch always runs first: it is the boot smoke, so it absorbs the
# one-time cold cost (XCUITest driver install, app boot, JS bundle load)
# with a generous wait - every later flow starts against a warm app.
# Without a pinned order, whichever flow ran first paid that cost and
# flaked its opening assertion on slow CI runners.
executionOrder:
  flowsOrder:
    - app-launch
    - sign-document-happy-path
    - cancel-from-signing-page
    - session-timeout-restart

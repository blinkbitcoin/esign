# wrangler deploy
#
# nodejs_compat is required: the DocuSign JWT assertion signs with
# node:crypto. The Worker's vars and secrets ARE the environment - the same
# names a container reads from its env file.
#
# Secrets (wrangler secret put <NAME>), never vars:
#   ESIGN_SESSION_SECRET (or nothing, when ESIGN_SESSION_JWKS_URL is used)
#   ESIGN_PREFILL_SECRET
#   DOCUSIGN_PRIVATE_KEY_BASE64   (_FILE paths are container-only)
#   DOCUSIGN_INTEGRATION_KEY, DOCUSIGN_ACCOUNT_ID, DOCUSIGN_USER_ID
name = "esign-service"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Refuse to start over anything this deployment does not verify
ESIGN_STRICT = "true"
ESIGN_PROVIDER = "docusign"
ESIGN_SESSION_JWKS_URL = "https://id.example.com/.well-known/jwks.json"
ESIGN_PREFILL_URL = "https://api.example.com/internal/esign/prefill"
DOCUSIGN_WEBFORM_ID = "change-me"
# Or mint envelopes instead (POST /envelope/instance, one envelope from the
# template; several ids, comma-separated, in that order) - no Web Form:
# ESIGN_MINT_MODE = "envelope"
# DOCUSIGN_TEMPLATE_ID = "change-me"
DOCUSIGN_RETURN_URL = "https://esign.example.com/signing/return"
DOCUSIGN_BASE_URL = "https://na4.docusign.net/restapi"
DOCUSIGN_OAUTH_URL = "https://account.docusign.com"

# Applies the envelope schema to DATABASE_URL. Run it once per database
# (and after an upgrade that adds a migration); it is only needed when
# envelope orchestration is on.
apiVersion: batch/v1
kind: Job
metadata:
  name: esign-service-migrate
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      containers:
        - name: migrate
          image: ghcr.io/blinkbitcoin/esign-service:latest
          command: ["node", "dist/node.js", "migrate"]
          envFrom:
            - secretRef:
                name: esign-service
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

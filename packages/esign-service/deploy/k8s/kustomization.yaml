# kubectl apply -k .
#
# Fill in secret.yaml and secret-docusign-pem.yaml first (or replace them
# with your secret manager's output). Nothing else here takes an input: the
# image tag and the environment are the only things a deployer changes.
#
# Two Secrets on purpose: secret.yaml is the environment (consumed with
# envFrom, so every key must be a valid variable name) and
# secret-docusign-pem.yaml is the key file (mounted).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secret.yaml
  - secret-docusign-pem.yaml
  - deployment.yaml
  - service.yaml
  - migrate-job.yaml
images:
  - name: ghcr.io/blinkbitcoin/esign-service
    newTag: latest

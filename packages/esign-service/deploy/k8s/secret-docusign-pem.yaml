# The RSA private key whose public half is on the DocuSign integration key.
#
# Its own Secret, and never part of the one the Deployment reads with
# `envFrom`: a PEM is a file, `docusign.pem` is not a valid environment
# variable name, and a Secret consumed as env with such a key makes kubelet
# emit an InvalidVariableNames event on every pod start. This one is only
# ever mounted - the Deployment mounts it at /run/secrets/docusign.pem and
# DOCUSIGN_PRIVATE_KEY_FILE points there.
#
# Deployments that keep the key in a variable instead
# (DOCUSIGN_PRIVATE_KEY_BASE64, the only form the Vercel and Worker targets
# accept) can drop this file and its volume, and put that variable in
# secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: esign-service-docusign-pem
type: Opaque
stringData:
  docusign.pem: |
    -----BEGIN RSA PRIVATE KEY-----
    change-me
    -----END RSA PRIVATE KEY-----

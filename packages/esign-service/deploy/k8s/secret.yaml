# Fill this in (or replace it with your secret manager's output) before
# applying. Every name here means the same thing on every deploy target.
#
# Every key in THIS Secret is an environment variable: the Deployment and the
# migrate Job consume it with `envFrom`, and kubelet refuses (and reports as
# an InvalidVariableNames event) any key that is not a valid variable name.
# The RSA private key is a file, not a variable, so it lives in its own
# Secret - secret-docusign-pem.yaml - which is mounted rather than injected.
apiVersion: v1
kind: Secret
metadata:
  name: esign-service
type: Opaque
stringData:
  # Session verification: one of these two
  ESIGN_SESSION_JWKS_URL: "https://id.example.com/.well-known/jwks.json"
  # ESIGN_SESSION_SECRET: "change-me"

  # The host endpoint that computes the field values actually minted
  ESIGN_PREFILL_URL: "https://api.example.com/internal/esign/prefill"
  ESIGN_PREFILL_SECRET: "change-me"

  # Envelope orchestration; remove it to deploy the mint alone
  DATABASE_URL: "postgresql://esign:change-me@postgres:5432/esign"

  ESIGN_PROVIDER: "docusign"
  # Refuse to start over anything this deployment does not verify
  ESIGN_STRICT: "true"
  DOCUSIGN_ACCOUNT_ID: "change-me"
  DOCUSIGN_INTEGRATION_KEY: "change-me"
  DOCUSIGN_USER_ID: "change-me"
  # The Web Form the mint answers with (the default, ESIGN_MINT_MODE=webform)
  DOCUSIGN_WEBFORM_ID: "change-me"
  # Or mint envelopes instead, with no Web Form: POST /envelope/instance
  # creates one envelope from DOCUSIGN_TEMPLATE_ID (no database needed).
  # Keep ESIGN_PREFILL_URL above: without it the caller names the signer, and
  # the banner reports that, and ESIGN_STRICT="true" above refuses it
  # ESIGN_MINT_MODE: "envelope"
  # Several ids, comma-separated, go out as one envelope in that order
  DOCUSIGN_TEMPLATE_ID: "change-me"
  # Only when the template's signer role is not named `signer`
  # DOCUSIGN_SIGNER_ROLE: "signer"
  DOCUSIGN_HMAC_KEY: "change-me"
  DOCUSIGN_RETURN_URL: "https://esign.example.com/signing/return"
  DOCUSIGN_BASE_URL: "https://na4.docusign.net/restapi"
  DOCUSIGN_OAUTH_URL: "https://account.docusign.com"

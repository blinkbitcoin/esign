# Docker Compose configuration for E2E tests
# Uses tmpfs for RAM-backed ephemeral storage (faster writes, auto-cleanup)
# Host port: ESIGN_TEST_DB_PORT (ESIGN_PORT_BASE + 12, default 4112 -
# scripts/lib/ports.mjs), so a second worktree's test database never
# fights this one; make test-db-up / scripts/e2e/test-db.sh export it

services:
  postgres-test:
    image: postgres:15
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: esign_test
    ports:
      - "${ESIGN_TEST_DB_PORT:-4112}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d esign_test"]
      interval: 2s
      timeout: 5s
      retries: 10

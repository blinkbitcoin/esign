# Keeps the major-tag-pinned actions (@v4 etc.) current without SHA-pinning
# maintenance burden - PRs arrive when actions release new majors.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 5

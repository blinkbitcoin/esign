# CodeQL configuration for .github/workflows/codeql.yml.
#
# Queries: the default security suite plus the maintainability/reliability
# queries (what GitHub's separate "Code quality" product runs).
#
# Query filters are the one durable way to silence a false positive here:
# an API dismissal is keyed on the alert's fingerprint and re-opens after
# every file move or nearby edit (alerts 1, 10 and 15 were the same finding
# three times), and inline `codeql[...]` / `lgtm[...]` markers are not
# honoured by this setup. Excluding the query removes the finding at the
# source, on every branch, forever.
name: esign

queries:
  - uses: security-and-quality

query-filters:
  # js/insufficient-password-hash: fires on the DocuSign JWT-grant signature
  # (createSign('RSA-SHA256') in packages/esign-server/src/providers/docusign/auth.ts)
  # because the JWT's `aud` claim is read from `config.oauthBaseUrl`, whose
  # name trips the query's password heuristic. Nothing in this repo hashes a
  # password; the DocuSign keys are RSA keypairs, not secrets to hash.
  - exclude:
      id: js/insufficient-password-hash

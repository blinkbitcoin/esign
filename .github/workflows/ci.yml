name: CI

# The one pipeline every branch runs, so a workflow badge filtered by branch
# (`ci.yml/badge.svg?branch=main`, or `?branch=<any>`) is correct for that
# branch. Unit and E2E are reusable workflows called as jobs; the coverage
# badge job inside test.yml publishes per branch to gh-pages.
#
# Publishing (main pushes / releases / dispatch) lives at the tail of the
# same run, so "CI passing on main" means: coverage thresholds, every E2E
# suite, the publish, and the registry smoke all passed for that commit.
#
#   - Stable (`latest` dist-tag): ONLY when a GitHub Release is published.
#     The release tag (vX.Y.Z) must match every package.json version.
#   - Prerelease (`next` dist-tag): every push to main (or a manual
#     dispatch) ships <version>-pre.<run>.<sha>. The inter-package
#     dependency on core is pinned to the exact prerelease version, since
#     semver ranges never match prereleases.
#
# Requires no extra secrets - GITHUB_TOKEN with packages:write is enough
# for same-org publishing.

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md'] # docs-only pushes ship nothing new
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# PR refs: a newer push supersedes an in-flight run. main: never cancel a
# running publish (GitHub still replaces a *pending* main run with a newer
# one, which is fine - the last commit is what the badge should reflect).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Single-segment caller names: GitHub's run graph collapses labels with
  # three or more "/" segments to "first / ... / last", so these render as
  # "Unit / Coverage", "E2E / iOS".
  unit:
    name: Unit
    uses: ./.github/workflows/test.yml
    # A called workflow cannot exceed its caller's permissions; test.yml's
    # badge job pushes the per-branch coverage badge to gh-pages.
    permissions:
      contents: write
  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yml

  # Unit / E2E status badges for this branch, next to the coverage badge:
  # gh-pages/badges/<branch>/{unit,e2e}.svg. A workflow badge can only
  # describe the whole pipeline, so the per-group result is rendered from
  # the job results instead. Same publish rules as the coverage badge job in
  # test.yml: always runs (a red "failing" replaces a stale green), skipped
  # for fork PRs (no write token) and release tags (not a branch). Both jobs
  # push gh-pages concurrently; each rebases and retries.
  status-badges:
    name: Status badges
    needs: [unit, e2e]
    if: |
      always() &&
      needs.unit.result != 'cancelled' && needs.e2e.result != 'cancelled' &&
      github.event_name != 'release' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Render Unit + E2E status badges
        env:
          UNIT: ${{ needs.unit.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          node scripts/status-badge.mjs unit Unit "$UNIT"
          node scripts/status-badge.mjs e2e E2E "$E2E"

      - name: Publish to gh-pages
        env:
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mv coverage/badge /tmp/badge
          if git fetch -q origin gh-pages; then
            git checkout -q gh-pages
          else
            git checkout -q --orphan gh-pages
            git rm -rfq --cached .
          fi
          git clean -fdxq -e node_modules
          mkdir -p "badges/$BRANCH"
          cp /tmp/badge/unit.svg /tmp/badge/unit.json /tmp/badge/e2e.svg /tmp/badge/e2e.json "badges/$BRANCH/"
          git add -A badges
          if git diff --cached --quiet; then echo "badges unchanged"; exit 0; fi
          git commit -qm "chore(ci): status badges for $BRANCH @ ${SHA::7}"
          for attempt in 1 2 3 4 5; do
            git push -q origin gh-pages && exit 0
            git fetch -q origin gh-pages && git rebase -q origin/gh-pages
            sleep $((attempt * 2))
          done
          echo "::error::could not push gh-pages after 5 attempts" && exit 1

  publish:
    name: Publish
    needs: [unit, e2e]
    # Ships only from main pushes, releases and manual dispatches; PR runs
    # stop after the gates.
    if: |
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@blinkbitcoin'

      - name: Install dependencies
        run: npm ci

      - name: Resolve version and dist-tag
        id: ver
        run: |
          PACKAGES="packages/esign-core packages/esign-react-native packages/esign-react"
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
            for p in $PACKAGES; do
              PKGV=$(node -p "require('./$p/package.json').version")
              if [ "$PKGV" != "$VERSION" ]; then
                echo "::error::$p is at $PKGV but the release tag says $VERSION - bump package versions before releasing"
                exit 1
              fi
            done
            echo "disttag=latest" >> "$GITHUB_OUTPUT"
          else
            BASE=$(node -p "require('./packages/esign-core/package.json').version")
            VERSION="${BASE}-pre.${{ github.run_number }}.$(git rev-parse --short HEAD)"
            for p in $PACKAGES; do
              (cd "$p" && npm pkg set version="$VERSION")
            done
            # ^X.Y.Z never matches a prerelease - pin core exactly
            (cd packages/esign-react-native && npm pkg set "dependencies.@blinkbitcoin/esign-core=$VERSION")
            (cd packages/esign-react && npm pkg set "dependencies.@blinkbitcoin/esign-core=$VERSION")
            echo "disttag=next" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Build (core first - the platform packages need its dist)
        run: npm run build

      - name: Publish @blinkbitcoin/esign-core
        run: npm publish -w packages/esign-core --tag ${{ steps.ver.outputs.disttag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @blinkbitcoin/esign-react-native
        run: npm publish -w packages/esign-react-native --tag ${{ steps.ver.outputs.disttag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @blinkbitcoin/esign-react
        run: npm publish -w packages/esign-react --tag ${{ steps.ver.outputs.disttag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Consumes what was ACTUALLY published: installs the exact version from
  # GitHub Packages into a clean project and asserts the consumer contract.
  registry-smoke:
    name: Registry smoke
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@blinkbitcoin'

      # GitHub Packages strips `peerDependenciesMeta` from the metadata npm
      # builds its tree from, so npm installs the optional Apollo peer as if
      # it were required. Nothing in the tarball can change that (it has the
      # field; pack-smoke.sh proves the tarball itself is right). So the
      # contract asserted here is the one the registry can deliver:
      #   1. a default install still never LOADS Apollo through /webform
      #   2. `--omit=peer` yields the documented Apollo-free install
      - name: Install the published packages (webform never loads Apollo)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          mkdir smoke && cd smoke
          npm init -y > /dev/null
          npm install "@blinkbitcoin/esign-core@$VERSION" > /dev/null
          echo "--- npm $(npm -v) / node $(node -v)"
          echo "--- published manifest peer metadata:"
          node -p "JSON.stringify(require('@blinkbitcoin/esign-core/package.json').peerDependenciesMeta ?? 'MISSING')"
          echo "--- @apollo/client in the tree (expected: yes, registry drops peerDependenciesMeta):"
          npm why @apollo/client || echo "(not installed)"
          node -e "
            const assert = require('node:assert');
            const webform = require('@blinkbitcoin/esign-core/webform');
            assert.equal(typeof webform.createWebFormsSource, 'function');
            assert.equal(typeof webform.createPublicUrlSource, 'function');
            const loaded = Object.keys(require.cache).filter(f => /node_modules[\\/](@apollo|graphql)/.test(f));
            assert.deepEqual(loaded, [], '/webform must not load Apollo or graphql');
            console.log('registry smoke: /webform loads Apollo-free for', process.env.VERSION);
          "

      - name: Install with --omit=peer (the documented Apollo-free install)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          mkdir smoke-lean && cd smoke-lean
          npm init -y > /dev/null
          npm install --omit=peer "@blinkbitcoin/esign-core@$VERSION" > /dev/null
          node -e "
            const assert = require('node:assert');
            require('@blinkbitcoin/esign-core/webform');
            let apollo = false;
            try { require.resolve('@apollo/client'); apollo = true; } catch {}
            assert.equal(apollo, false, '--omit=peer install must not contain Apollo');
            console.log('registry smoke: --omit=peer install is Apollo-free');
          "

name: Tests / E2E

# Reusable only: ci.yml calls this for every branch (push to main, PRs,
# releases). Concurrency is the caller's.
#
# The iOS job is opt-in. It needs a macOS runner, and GitHub-hosted macOS is
# billed at 10x Linux: one ~15 min iOS run costs ~150 Linux minutes, and it
# used to run on every push. The caller decides (repo variable / PR label,
# see ci.yml); a skipped job costs nothing and still counts as success for
# the caller's `needs.e2e.result`.
on:
  workflow_call:
    inputs:
      ios:
        description: Run the iOS simulator suite (needs a macOS runner)
        type: boolean
        default: false
      ios-runner:
        description: runs-on label(s) for the iOS job (string or JSON array)
        type: string
        default: macos-latest

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Check schema artifact and generated client code are current
        run: |
          npm run codegen
          # shellcheck disable=SC2016 # backticks in the message are markdown, not expansion
          git diff --exit-code -- apps/api/schema.graphql 'packages/*/src/generated' \
            || (echo '::error::schema.graphql or generated client code is stale - run `make codegen` and commit' && exit 1)

      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Wait for database to be ready
        run: |
          for i in {1..30}; do
            if docker compose -f docker-compose.test.yml exec -T postgres-test pg_isready -U test -d esign_test; then
              echo "Database is ready"
              exit 0
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
          echo "ERROR: Database failed to become ready after 60 seconds"
          exit 1

      - name: Run database migrations
        run: npm run migrate:test
        working-directory: apps/api

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: apps/api

      - name: Stop test database
        if: always()
        run: docker compose -f docker-compose.test.yml down

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run migrations (test database)
        run: npm run migrate:test -w apps/api

      - name: Run browser E2E (Playwright starts backend + Vite)
        run: npm run test:e2e -w examples/react-demo

      - name: Stop test database
        if: always()
        run: docker compose -f docker-compose.test.yml down

  ios:
    name: iOS
    # Off unless the caller asks (see the header). Once self-hosted Apple
    # silicon runners exist, `ios-runner` points at them and GitHub-hosted
    # macOS is never touched again.
    if: inputs.ios
    runs-on: ${{ inputs.ios-runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Cache Maestro CLI
        uses: actions/cache@v6
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-2.6.1

      - name: Install Maestro CLI
        env:
          MAESTRO_VERSION: 2.6.1 # version the E2E suites are proven against
        run: |
          if [ ! -x "$HOME/.maestro/bin/maestro" ]; then
            curl -Ls "https://get.maestro.mobile.dev" | bash
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Runner images rotate simulator generations (iPhone 15 -> 16 -> 17...);
      # pick whatever iPhone the image actually ships instead of hardcoding.
      # Booting starts here so it overlaps everything below (build or cache
      # restore, Postgres, backend, Metro).
      - name: Pick a simulator device
        run: |
          DEVICE_NAME=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[] | .[] | select(.isAvailable and (.name | startswith("iPhone")))] | .[0].name')
          if [ -z "$DEVICE_NAME" ] || [ "$DEVICE_NAME" = "null" ]; then
            echo "::error::No available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $DEVICE_NAME"
          echo "SIM_DEVICE=$DEVICE_NAME" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_NAME" || true

      # Debug builds load their JS from Metro, so the .app only depends on the
      # native inputs: the ios/ project (incl. Podfile.lock), app.json, the
      # Ruby lockfile, and the lockfile-resolved versions of the demo's runtime
      # deps + @react-native* dev deps (scripts/native-deps-hash.sh - what
      # autolinking and codegen read). Everything else in package-lock.json is
      # JS-only, so a jest/eslint/backend bump still hits this cache and skips
      # Ruby, Pods and Xcode entirely. Bump the v-suffix if an input the script
      # cannot see changes.
      - name: Compute native dependency hash
        id: native-deps
        run: |
          HASH=$(bash scripts/native-deps-hash.sh)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Restore iOS app build
        id: ios-app
        uses: actions/cache@v6
        with:
          path: examples/react-native-demo/ios/build/Build/Products/Debug-iphonesimulator/ReactNativeSandbox.app
          key: ios-app-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-deps.outputs.hash }}-${{ hashFiles('examples/react-native-demo/ios/**', 'examples/react-native-demo/app.json', 'examples/react-native-demo/Gemfile.lock') }}

      - name: Setup Ruby
        if: steps.ios-app.outputs.cache-hit != 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Cache CocoaPods
        if: steps.ios-app.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            examples/react-native-demo/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('examples/react-native-demo/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install CocoaPods dependencies
        if: steps.ios-app.outputs.cache-hit != 'true'
        run: |
          cd examples/react-native-demo
          bundle install
          cd ios
          bundle exec pod install

      # Metro starts in the background here so its boot overlaps the build;
      # it is awaited (and the bundle prewarmed) right before Maestro runs.
      - name: Start Metro bundler (background)
        working-directory: examples/react-native-demo
        run: npm start > "$RUNNER_TEMP/metro.log" 2>&1 &

      # Built for the generic simulator destination: the build does not need
      # a concrete device (the app is installed on the booted one later), and
      # xcodebuild's device enumeration intermittently returns only
      # placeholders on fresh runners ("Unable to find a device matching the
      # provided destination specifier"), even though simctl lists the device.
      - name: Build iOS app for simulator
        if: steps.ios-app.outputs.cache-hit != 'true'
        run: |
          cd examples/react-native-demo/ios
          xcodebuild \
            -workspace ReactNativeSandbox.xcworkspace \
            -scheme ReactNativeSandbox \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            build

      # macOS runners have no Docker - run the test database via Homebrew
      # Postgres instead, matching docker-compose.test.yml (test/test@5433,
      # tmpfs-equivalent: the runner is ephemeral anyway).
      - name: Start test database (Homebrew Postgres, port 5433)
        run: |
          brew install postgresql@16
          PGBIN="$(brew --prefix postgresql@16)/bin"
          echo "test" > "$RUNNER_TEMP/pgpass"
          "$PGBIN/initdb" -D "$RUNNER_TEMP/pgdata" -U test --pwfile="$RUNNER_TEMP/pgpass"
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pgdata" -o "-p 5433" -l "$RUNNER_TEMP/pg.log" start
          for i in {1..15}; do
            if "$PGBIN/pg_isready" -h localhost -p 5433 -U test; then break; fi
            echo "Waiting for database... ($i/15)"; sleep 2
          done
          "$PGBIN/createdb" -h localhost -p 5433 -U test esign_test
          "$PGBIN/pg_isready" -h localhost -p 5433 -U test -d esign_test

      - name: Run database migrations
        run: npm run migrate:test
        working-directory: apps/api

      - name: Start backend with mock provider
        run: |
          cd apps/api
          ESIGN_PROVIDER=mock npx dotenv-cli -e .env.test -- npm run dev &
          # Wait for backend to be ready
          for i in {1..30}; do
            if curl -s http://localhost:4000/health > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "ERROR: Backend failed to start"
          exit 1

      - name: Wait for iOS Simulator (booting since device pick)
        run: xcrun simctl bootstatus "$SIM_DEVICE" -b

      - name: Install app on simulator
        run: |
          xcrun simctl install booted examples/react-native-demo/ios/build/Build/Products/Debug-iphonesimulator/ReactNativeSandbox.app

      # Prewarming the bundle keeps the first Maestro launch from racing a
      # cold compile.
      - name: Wait for Metro + prewarm bundle
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:8081/status | grep -q packager-status:running; then
              echo "Metro is ready"; break
            fi
            echo "Waiting for Metro... ($i/60)"; sleep 2
          done
          curl -sf "http://localhost:8081/index.bundle?platform=ios&dev=true" -o /dev/null
          echo "Bundle prewarmed"

      - name: Run Maestro tests (webform-tagged flows excluded - they need an ESIGN_MODE=webform Metro)
        env:
          # CI simulators are slow to install+launch the XCUITest driver;
          # the default startup timeout regularly trips on cold runners.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '600000'
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          # Each flow retries itself once (see the `retry` blocks in .maestro/):
          # Maestro's iOS driver misreads a slow terminate->relaunch cycle as
          # an app crash (no real crash - DiagnosticReports stays empty). The
          # suite-level retry below is the last resort, not the expected path.
          npm run test:e2e || {
            echo "::warning::Maestro suite failed after per-flow retries - rerunning the suite once"
            npm run test:e2e
          }

      - name: Stop backend
        if: always()
        run: pkill -f "npm run dev" || true

      - name: Upload Maestro test results + crash reports
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: maestro-results
          path: |
            ~/.maestro/tests/
            ~/Library/Logs/DiagnosticReports/
            ${{ runner.temp }}/metro.log
          retention-days: 7

  android:
    name: Android (${{ matrix.attempt }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # TEMPORARY soak test - drop before merge
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Debug builds load their JS from Metro, so the APK only depends on the
      # native inputs: the android/ project, app.json, and the lockfile-resolved
      # versions of the demo's runtime deps + @react-native* dev deps
      # (scripts/native-deps-hash.sh - what autolinking and codegen read).
      # Everything else in package-lock.json is JS-only, so a jest/eslint/
      # backend bump still hits this cache and skips Java, Gradle and the disk
      # cleanup entirely. Bump the v-suffix if an input the script cannot see
      # changes.
      - name: Compute native dependency hash
        id: native-deps
        run: |
          HASH=$(bash scripts/native-deps-hash.sh)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Restore Android APK build
        id: android-apk
        uses: actions/cache@v6
        with:
          path: examples/react-native-demo/android/app/build/outputs/apk/debug/app-debug.apk
          key: android-apk-v2-${{ steps.native-deps.outputs.hash }}-${{ hashFiles('examples/react-native-demo/android/**', 'examples/react-native-demo/app.json') }}

      # The stock runner has ~14GB free; node_modules + the Android system
      # image + Docker (+ Gradle on a cache miss) don't fit - a run that
      # skipped this hit "Your device does not have enough disk space to run
      # avd". Drop preinstalled toolchains we never use (several GB each).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY/CodeQL"
          sudo docker image prune -af
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java (for Gradle)
        if: steps.android-apk.outputs.cache-hit != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Cache Maestro CLI
        uses: actions/cache@v6
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-2.6.1

      - name: Install Maestro CLI
        env:
          MAESTRO_VERSION: 2.6.1 # keep in sync with the iOS job
        run: |
          if [ ! -x "$HOME/.maestro/bin/maestro" ]; then
            curl -Ls "https://get.maestro.mobile.dev" | bash
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Hardware acceleration for the emulator (GitHub-hosted Linux runners
      # expose KVM but the device node needs opening up)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # actions/cache paths can't read the runner's own environment
          # (only workflow-set env), so surface the SDK root for it
          echo "ANDROID_SDK_DIR=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run database migrations
        run: npm run migrate:test
        working-directory: apps/api

      - name: Start backend with mock provider
        run: |
          cd apps/api
          ESIGN_PROVIDER=mock npx dotenv-cli -e .env.test -- npm run dev &
          for i in {1..30}; do
            if curl -s http://localhost:4000/health > /dev/null; then
              echo "Backend is ready"; exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "ERROR: Backend failed to start"; exit 1

      # The emulator reaches the backend as 10.0.2.2:4000 (host loopback
      # alias - see examples/react-native-demo/src/config.ts); Metro is
      # reached via adb reverse in scripts/e2e-android-maestro.sh. Metro
      # starts in the background so its boot overlaps the Gradle build; it
      # is awaited (and the bundle prewarmed) right before the emulator runs.
      - name: Start Metro bundler (background)
        working-directory: examples/react-native-demo
        run: npm start > "$RUNNER_TEMP/metro.log" 2>&1 &

      - name: Build Android app (debug)
        if: steps.android-apk.outputs.cache-hit != 'true'
        working-directory: examples/react-native-demo/android
        run: ./gradlew assembleDebug --no-daemon --build-cache

      # The system image is ~1.2GB and the emulator-runner action re-downloads
      # it on every run (~95s, twice when the AVD snapshot also misses).
      # sdkmanager treats an already-installed current revision as a no-op.
      - name: Cache Android system image
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_SDK_DIR }}/system-images/android-34
          key: android-system-image-v1-android-34-default-x86_64

      # AVD snapshot caching per the emulator-runner README: a cold run
      # generates the snapshot once; warm runs boot from it in seconds.
      - name: Cache AVD snapshot
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-v4-34-x86_64-default

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          # Baked into the snapshot: the software-GPU emulator stalls Pixel
          # Launcher during boot/snapshot restore and its ANR dialog ("Pixel
          # Launcher isn't responding") then covers the app - Maestro's
          # hierarchy only sees the dialog and every flow times out. Setting
          # it right before Maestro is too late for an ANR already queued.
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put secure anr_show_background 0
            echo "Generated AVD snapshot for caching (error dialogs hidden)."

      - name: Wait for Metro + prewarm bundle
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:8081/status | grep -q packager-status:running; then
              echo "Metro is ready"; break
            fi
            echo "Waiting for Metro... ($i/60)"; sleep 2
          done
          curl -sf "http://localhost:8081/index.bundle?platform=android&dev=true" -o /dev/null
          echo "Bundle prewarmed"

      - name: Run Maestro tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Same reason as the iOS job: Maestro gives its instrumentation
          # driver 15s by default to come up, and a cold runner can take
          # longer to install + start it (every flow then fails in 0s with
          # "Not able to reach the gRPC server"). The action passes job env
          # through to `script`.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '600000'
        with:
          api-level: 34
          arch: x86_64
          # AOSP image on purpose, not google_apis: the demo app has no Play
          # Services dependency (system WebView only), and the Google image's
          # ~15 Google apps + gms saturated the 2-core software-GPU guest right
          # after the snapshot restore (gms ANRs, YouTube/Gmail/Chrome being
          # killed for binder traffic) - which is when Maestro installs its
          # driver. Every flaky failure signature (driver gRPC UNAVAILABLE,
          # app-launch never rendering, WebView asserts timing out) was that
          # starvation. Stays on the default 2 cores: 4 on a 4-vCPU runner
          # that also hosts Metro, the backend and Postgres starved the guest
          # even worse.
          target: default
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # One line only: the action runs each script line as its own `sh -c`
          script: bash scripts/e2e-android-maestro.sh

      - name: Upload Maestro test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: maestro-results-android
          path: |
            ~/.maestro/tests/
            ${{ runner.temp }}/android-logs/
            ${{ runner.temp }}/metro.log
          retention-days: 7

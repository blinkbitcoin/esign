name: E2E Tests

on:
  push:
    branches-ignore: [main] # main is covered by the publish workflow's gates
    paths-ignore: ['docs/**', '**.md'] # docs-only pushes skip; PRs always run
  pull_request:
  workflow_call: # reused as a publish gate (see publish.yml)

permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run. Safe with the
# publish gates: publish.yml serializes itself per ref.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Check schema artifact and generated client code are current
        run: |
          npm run codegen
          # shellcheck disable=SC2016 # backticks in the message are markdown, not expansion
          git diff --exit-code -- apps/api/schema.graphql 'packages/*/src/generated' \
            || (echo '::error::schema.graphql or generated client code is stale - run `make codegen` and commit' && exit 1)

      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Wait for database to be ready
        run: |
          for i in {1..30}; do
            if docker compose -f docker-compose.test.yml exec -T postgres-test pg_isready -U test -d esign_test; then
              echo "Database is ready"
              exit 0
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done
          echo "ERROR: Database failed to become ready after 60 seconds"
          exit 1

      - name: Run database migrations
        run: npm run migrate:test
        working-directory: apps/api

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: apps/api

      - name: Stop test database
        if: always()
        run: docker compose -f docker-compose.test.yml down

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run migrations (test database)
        run: npm run migrate:test -w apps/api

      - name: Run browser E2E (Playwright starts backend + Vite)
        run: npm run test:e2e -w examples/react-demo

      - name: Stop test database
        if: always()
        run: docker compose -f docker-compose.test.yml down

  ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            examples/react-native-demo/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('examples/react-native-demo/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install CocoaPods dependencies
        run: |
          cd examples/react-native-demo
          bundle install
          cd ios
          bundle exec pod install

      - name: Cache Maestro CLI
        uses: actions/cache@v6
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-2.6.1

      - name: Install Maestro CLI
        env:
          MAESTRO_VERSION: 2.6.1 # version the E2E suites are proven against
        run: |
          if [ ! -x "$HOME/.maestro/bin/maestro" ]; then
            curl -Ls "https://get.maestro.mobile.dev" | bash
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # macOS runners have no Docker - run the test database via Homebrew
      # Postgres instead, matching docker-compose.test.yml (test/test@5433,
      # tmpfs-equivalent: the runner is ephemeral anyway).
      - name: Start test database (Homebrew Postgres, port 5433)
        run: |
          brew install postgresql@16
          PGBIN="$(brew --prefix postgresql@16)/bin"
          echo "test" > "$RUNNER_TEMP/pgpass"
          "$PGBIN/initdb" -D "$RUNNER_TEMP/pgdata" -U test --pwfile="$RUNNER_TEMP/pgpass"
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pgdata" -o "-p 5433" -l "$RUNNER_TEMP/pg.log" start
          for i in {1..15}; do
            if "$PGBIN/pg_isready" -h localhost -p 5433 -U test; then break; fi
            echo "Waiting for database... ($i/15)"; sleep 2
          done
          "$PGBIN/createdb" -h localhost -p 5433 -U test esign_test
          "$PGBIN/pg_isready" -h localhost -p 5433 -U test -d esign_test

      - name: Run database migrations
        run: npm run migrate:test
        working-directory: apps/api

      - name: Start backend with mock provider
        run: |
          cd apps/api
          ESIGN_PROVIDER=mock npx dotenv-cli -e .env.test -- npm run dev &
          # Wait for backend to be ready
          for i in {1..30}; do
            if curl -s http://localhost:4000/health > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "ERROR: Backend failed to start"
          exit 1

      # Runner images rotate simulator generations (iPhone 15 -> 16 -> 17...);
      # pick whatever iPhone the image actually ships instead of hardcoding.
      - name: Pick a simulator device
        run: |
          DEVICE_NAME=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[] | .[] | select(.isAvailable and (.name | startswith("iPhone")))] | .[0].name')
          if [ -z "$DEVICE_NAME" ] || [ "$DEVICE_NAME" = "null" ]; then
            echo "::error::No available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $DEVICE_NAME"
          echo "SIM_DEVICE=$DEVICE_NAME" >> "$GITHUB_ENV"
          # Kick the boot off now so it overlaps the Xcode build below
          xcrun simctl boot "$DEVICE_NAME" || true

      - name: Build iOS app for simulator
        run: |
          cd examples/react-native-demo/ios
          xcodebuild \
            -workspace ReactNativeSandbox.xcworkspace \
            -scheme ReactNativeSandbox \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${SIM_DEVICE},OS=latest" \
            -derivedDataPath build \
            build

      - name: Wait for iOS Simulator (booting since device pick)
        run: xcrun simctl bootstatus "$SIM_DEVICE" -b

      - name: Install app on simulator
        run: |
          xcrun simctl install booted examples/react-native-demo/ios/build/Build/Products/Debug-iphonesimulator/ReactNativeSandbox.app

      # Debug builds load their JS from Metro; prewarming the bundle keeps
      # the first Maestro launch from racing a cold compile.
      - name: Start Metro bundler
        working-directory: examples/react-native-demo
        run: |
          npm start &
          for i in {1..60}; do
            if curl -s http://localhost:8081/status | grep -q packager-status:running; then
              echo "Metro is ready"; break
            fi
            echo "Waiting for Metro... ($i/60)"; sleep 2
          done
          curl -sf "http://localhost:8081/index.bundle?platform=ios&dev=true" -o /dev/null
          echo "Bundle prewarmed"

      - name: Run Maestro tests (webform-tagged flows excluded - they need an ESIGN_MODE=webform Metro)
        env:
          # CI simulators are slow to install+launch the XCUITest driver;
          # the default startup timeout regularly trips on cold runners.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '600000'
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          # One retry: Maestro's iOS driver misreads a slow terminate->relaunch
          # cycle as an app crash (~10s terminations on CI simulators hit a
          # random flow most runs; no real crash - DiagnosticReports stays empty)
          npm run test:e2e || {
            echo "::warning::Maestro suite failed - retrying once (known driver relaunch race)"
            npm run test:e2e
          }

      - name: Stop backend
        if: always()
        run: pkill -f "npm run dev" || true

      - name: Upload Maestro test results + crash reports
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: maestro-results
          path: |
            ~/.maestro/tests/
            ~/Library/Logs/DiagnosticReports/
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # The stock runner has ~14GB free; node_modules + Gradle + the Android
      # system image + Docker don't fit. Drop preinstalled toolchains we
      # never use (several GB each).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY/CodeQL"
          sudo docker image prune -af
          df -h /

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java (for Gradle)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Cache Maestro CLI
        uses: actions/cache@v6
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-2.6.1

      - name: Install Maestro CLI
        env:
          MAESTRO_VERSION: 2.6.1 # keep in sync with the iOS job
        run: |
          if [ ! -x "$HOME/.maestro/bin/maestro" ]; then
            curl -Ls "https://get.maestro.mobile.dev" | bash
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Hardware acceleration for the emulator (GitHub-hosted Linux runners
      # expose KVM but the device node needs opening up)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run database migrations
        run: npm run migrate:test
        working-directory: apps/api

      - name: Start backend with mock provider
        run: |
          cd apps/api
          ESIGN_PROVIDER=mock npx dotenv-cli -e .env.test -- npm run dev &
          for i in {1..30}; do
            if curl -s http://localhost:4000/health > /dev/null; then
              echo "Backend is ready"; exit 0
            fi
            echo "Waiting for backend... ($i/30)"; sleep 2
          done
          echo "ERROR: Backend failed to start"; exit 1

      # The emulator reaches the backend as 10.0.2.2:4000 (host loopback
      # alias - see examples/react-native-demo/src/config.ts); Metro is
      # reached via adb reverse below.
      - name: Start Metro bundler
        working-directory: examples/react-native-demo
        run: |
          npm start &
          for i in {1..60}; do
            if curl -s http://localhost:8081/status | grep -q packager-status:running; then
              echo "Metro is ready"; break
            fi
            echo "Waiting for Metro... ($i/60)"; sleep 2
          done
          curl -sf "http://localhost:8081/index.bundle?platform=android&dev=true" -o /dev/null
          echo "Bundle prewarmed"

      - name: Build Android app (debug)
        working-directory: examples/react-native-demo/android
        run: ./gradlew assembleDebug --no-daemon --build-cache

      # AVD snapshot caching per the emulator-runner README: a cold run
      # generates the snapshot once; warm runs boot from it in seconds.
      - name: Cache AVD snapshot
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run Maestro tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install examples/react-native-demo/android/app/build/outputs/apk/debug/app-debug.apk
            # Metro + backend: the signing WebView loads localhost:4000 URLs
            # minted by the mock provider - reverse both into the emulator
            adb reverse tcp:8081 tcp:8081
            adb reverse tcp:4000 tcp:4000
            export PATH="$HOME/.maestro/bin:$PATH"
            npm run test:e2e:android -w examples/react-native-demo

      - name: Upload Maestro test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: maestro-results-android
          path: ~/.maestro/tests/
          retention-days: 7

name: Release

# Everything that turns merged commits into a version. Two jobs, one per
# event; the other is skipped. The whole pipeline in one picture:
# docs/diagrams/README.md#ci--release-pipeline.
#
# Release PR / Tag (push to main)
#   release-please reads the Conventional Commits since the last release
#   (the squashed PR titles commitlint enforces), infers the bump
#   (feat -> minor, fix -> patch, `!` / BREAKING CHANGE -> minor while < 1.0)
#   and keeps ONE open pull request, "chore(release): X.Y.Z", up to date with
#   the grouped changelog entry and the root package.json version. Nothing
#   happens until a human merges that PR; merging it is the whole release
#   step (`make release`). ci/docs/chore commits alone never open one.
#
#   Merging the release PR lands on main, this job runs again, sees the
#   merged release PR, creates the tag + GitHub Release (body = the changelog
#   section), and then starts the release run of ci.yml at that tag. The
#   explicit dispatch is needed because GitHub never triggers workflows from
#   events the workflow token itself created - a release made here would not
#   fire ci.yml's `release:` trigger. ci.yml treats a dispatch with
#   `release_tag` exactly like a `release` event (tag = version, `latest`),
#   including the green-main gate below. No extra secrets.
#
#   The same token rule means CI does not run on the release PR itself. It
#   only touches CHANGELOG.md, the manifest and the root package.json /
#   package-lock.json; the tagged run executes the full pipeline before
#   anything ships. The org ruleset must exclude `release-please--**` so the
#   token can push the release branch (docs/releasing.md, Setup).
#
# Re-run blocked releases (CI completed on main)
#   Makes a release fire-and-forget. ci.yml's Publish job refuses to ship a
#   release while the commit's push-to-main run is red (see the gate there).
#   When CI on main completes green, find any release run for that commit
#   that failed and re-run its failed jobs (Publish + Verify only - the gates
#   already passed inside that run).
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / Tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # tag + release + the release branch
      pull-requests: write # the release PR
      actions: write # dispatch ci.yml at the tag
    steps:
      - name: Update the release PR, or tag the merged one
        id: release
        uses: googleapis/release-please-action@v5

      - name: Start the release run of ci.yml at the new tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run ci.yml --repo "$REPO" --ref "$TAG" -f "release_tag=$TAG"

  retry:
    name: Re-run blocked releases
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # re-run the failed jobs
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Re-run failed release runs for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/release/rerun-blocked.sh

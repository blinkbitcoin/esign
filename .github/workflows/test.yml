name: Tests / Unit

on:
  push:
    branches-ignore: [main] # main is covered by the publish workflow's gates
    paths-ignore: ['docs/**', '**.md'] # docs-only pushes skip; PRs always run
  pull_request:
  workflow_call: # reused as a publish gate (see publish.yml)

permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run. Safe with the
# publish gates: publish.yml serializes itself per ref.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Dependency audit (known upstream issues allowlisted)
        run: npx audit-ci --config audit-ci.jsonc

      - name: Lint GitHub Actions workflows (actionlint)
        run: |
          docker run --rm -v "$PWD":/repo --workdir /repo rhysd/actionlint:latest -color

      - name: Check generated diagrams are current
        run: |
          node scripts/assemble-diagrams.mjs
          # shellcheck disable=SC2016 # backticks in the message are markdown, not expansion
          git diff --exit-code -- docs/diagrams/README.md \
            || (echo '::error::README.md is stale - edit src/*.mmd and run `make diagrams`' && exit 1)

      - name: Lint + typecheck + format check
        run: make check-code

      # Coverage thresholds are enforced per workspace: 100% on the three
      # packages and the backend, current-level floors on the demo apps.
      - name: Unit tests with coverage
        run: npm run test:coverage

      # Rendered on every run so the script itself is exercised; only the
      # `badge` job below (main pushes) publishes it.
      - name: Render coverage badge (packages + backend)
        run: npm run coverage:badge

      - name: Upload coverage badge
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: coverage/badge/
          retention-days: 1
          if-no-files-found: error

  # Publishes the rendered badge to the `gh-pages` branch, which README.md
  # embeds. gh-pages is the one branch the org ruleset exempts from the
  # PR-approval requirement, so the default GITHUB_TOKEN can push there.
  # main is excluded from this workflow's own push trigger, so in practice
  # this runs via publish.yml's workflow_call on main pushes / dispatches.
  badge:
    name: Coverage badge
    needs: unit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download coverage badge
        uses: actions/download-artifact@v8
        with:
          name: coverage-badge
          path: badge

      - name: Publish to gh-pages
        env:
          SHA: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan gh-pages
          git rm -rfq --cached .
          git clean -fdxq -e badge
          mv badge/coverage.svg badge/coverage.json .
          rm -rf badge
          printf '%s\n' \
            '# CI-owned branch' \
            '' \
            'Generated by the Coverage badge job in .github/workflows/test.yml on every push to main.' \
            'Do not edit by hand - the next run force-pushes over it.' > README.md
          git add coverage.svg coverage.json README.md
          git commit -qm "chore(ci): coverage badge for ${SHA}"
          git push --force origin gh-pages

  packages:
    name: Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Package shape (publint + arethetypeswrong)
        run: npm run check:packages

      - name: Pack + install smoke (webform Apollo-free boundary)
        run: bash scripts/pack-smoke.sh

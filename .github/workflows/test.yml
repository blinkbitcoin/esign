name: Tests / Unit

# Reusable only: ci.yml calls this for every branch (push to main, PRs,
# releases), after the Checks stage (checks.yml: lint, typecheck, package
# shape, commits, docs) has passed. Concurrency is the caller's.
on:
  workflow_call:

# A registry request that hangs costs one minute per attempt instead of
# npm's default five (#52). Warm installs make no request at all.
env:
  NPM_CONFIG_FETCH_TIMEOUT: '60000'

permissions:
  contents: read

jobs:
  unit:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci --prefer-offline --no-audit

      # Coverage thresholds are enforced per workspace: 100% on the three
      # packages and the backend, current-level floors on the demo apps.
      - name: Unit tests with coverage
        run: npm run test:coverage

      # Badge + combined HTML report (packages + backend). The `Badges` job in
      # ci.yml publishes the badge per branch to gh-pages once E2E is done (it
      # is not on the E2E critical path); the report stays a run artifact -
      # private, unlike GitHub Pages, which would expose the source embedded
      # in it.
      - name: Render coverage badge + HTML report
        run: npm run coverage:badge

      - name: Upload coverage badge
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: coverage/badge/coverage.svg
          retention-days: 1
          if-no-files-found: error

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/report/
          retention-days: 30
          if-no-files-found: error

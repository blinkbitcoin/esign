name: Checks / Commits (title edit)

# The gating commit + title lint is the Commits job in checks.yml, run by
# ci.yml on every PR push. This only covers a PR title edit: ci.yml does not
# run on `edited` (a title change must not re-run the whole pipeline), and a
# re-run of the ci.yml job would still see the title from the original event
# payload. Rules: commitlint.config.mjs.
on:
  pull_request:
    types: [edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: Title
    if: github.event.pull_request.user.login != 'dependabot[bot]' && github.event.changes.title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci --ignore-scripts --prefer-offline --no-audit

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose

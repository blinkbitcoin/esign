name: Checks / Commits

# Conventional Commits on the PR's commits and its title (squash merges take
# the title as the commit on main). Rules: commitlint.config.mjs.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    # Dependabot's messages are shaped by dependabot.yml's commit-message
    # config; no need to re-lint its bot-authored commits. Keyed on the PR
    # author, not github.actor: a human updating the branch would otherwise
    # re-trigger the lint against Dependabot's commits.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # commitlint needs the base..head range

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace root)
        run: npm ci --ignore-scripts

      - name: Lint PR commits
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose

name: Release / Retry

# Makes `make release` fire-and-forget. ci.yml's Publish job refuses to ship
# a release while the commit's push-to-main run is red (see the gate there).
# When CI on main completes green, find any release tagged on that commit
# whose release run failed and re-run its failed jobs (Publish + Verify
# only - the gates already passed inside that run).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    name: Re-run blocked releases
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Re-run failed release runs for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/release/rerun-blocked.sh

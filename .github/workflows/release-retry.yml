name: Release / Retry

# Makes `make release` fire-and-forget. ci.yml's Publish job refuses to ship
# a release while the commit's push-to-main run is red (see the gate there).
# When CI on main completes green, find any release tagged on that commit
# whose release run failed and re-run its failed jobs (Publish + Registry
# smoke only - the gates already passed inside that run).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    name: Re-run blocked releases
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run failed release runs for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=release&head_sha=$SHA&per_page=20" \
            --jq '.workflow_runs[] | select(.conclusion == "failure") | "\(.id) \(.head_branch)"' \
          | while read -r id tag; do
              echo "main is green for ${SHA::7}: re-running failed jobs of release run $id ($tag)"
              gh api -X POST "repos/$REPO/actions/runs/$id/rerun-failed-jobs" >/dev/null
            done
          echo "done"

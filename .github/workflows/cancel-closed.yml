name: Checks / Closed PR

# A merged or closed PR still has its pull_request / push runs in flight
# (iOS + Android E2E can take 20+ minutes). GitHub does not cancel them on
# its own, so this cancels every queued or running run for the PR's head
# commit. The push-to-main run is on a different commit and is untouched.
on:
  pull_request:
    types: [closed]

permissions:
  actions: write

jobs:
  cancel:
    name: Cancel in-flight runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel runs for the PR head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for status in queued in_progress; do
            gh api "repos/$REPO/actions/runs?head_sha=$SHA&status=$status&per_page=100" \
              --jq '.workflow_runs[] | select(.id != '"$GITHUB_RUN_ID"') | "\(.id) \(.name)"' \
            | while read -r id name; do
                echo "cancelling $id ($name)"
                gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null
              done
          done

name: Release / Packages

# Publishes the three client packages to GitHub Packages (npm.pkg.github.com)
# under the blinkbitcoin org. Two publish channels:
#
#   - Stable (`latest` dist-tag): ONLY when a GitHub Release is published.
#     The release tag (vX.Y.Z) must match every package.json version.
#   - Prerelease (`next` dist-tag): every push to main (or a manual
#     dispatch) ships <version>-pre.<run>.<sha>. The inter-package
#     dependency on core is pinned to the exact prerelease version, since
#     semver ranges never match prereleases.
#
# Both channels are gated on the full test fleet: unit tests with enforced
# coverage thresholds + every E2E suite, reused via workflow_call.
# Requires no extra secrets - GITHUB_TOKEN with packages:write is enough
# for same-org publishing.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md'] # docs-only pushes ship nothing new
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Caller jobs carry the called workflow's name so the reused jobs label
  # the same here as in their own runs (CI / Tests / Unit, CI / E2E / iOS).
  checks:
    name: CI / Tests
    uses: ./.github/workflows/test.yml
  e2e:
    name: CI / E2E
    uses: ./.github/workflows/e2e.yml

  publish:
    name: Publish
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@blinkbitcoin'

      - name: Install dependencies
        run: npm ci

      - name: Resolve version and dist-tag
        id: ver
        run: |
          PACKAGES="packages/esign-core packages/esign-react-native packages/esign-react"
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
            for p in $PACKAGES; do
              PKGV=$(node -p "require('./$p/package.json').version")
              if [ "$PKGV" != "$VERSION" ]; then
                echo "::error::$p is at $PKGV but the release tag says $VERSION - bump package versions before releasing"
                exit 1
              fi
            done
            echo "disttag=latest" >> "$GITHUB_OUTPUT"
          else
            BASE=$(node -p "require('./packages/esign-core/package.json').version")
            VERSION="${BASE}-pre.${{ github.run_number }}.$(git rev-parse --short HEAD)"
            for p in $PACKAGES; do
              (cd "$p" && npm pkg set version="$VERSION")
            done
            # ^X.Y.Z never matches a prerelease - pin core exactly
            (cd packages/esign-react-native && npm pkg set "dependencies.@blinkbitcoin/esign-core=$VERSION")
            (cd packages/esign-react && npm pkg set "dependencies.@blinkbitcoin/esign-core=$VERSION")
            echo "disttag=next" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Build (core first - the platform packages need its dist)
        run: npm run build

      - name: Publish @blinkbitcoin/esign-core
        run: npm publish -w packages/esign-core --tag ${{ steps.ver.outputs.disttag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @blinkbitcoin/esign-react-native
        run: npm publish -w packages/esign-react-native --tag ${{ steps.ver.outputs.disttag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @blinkbitcoin/esign-react
        run: npm publish -w packages/esign-react --tag ${{ steps.ver.outputs.disttag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Consumes what was ACTUALLY published: installs the exact version from
  # GitHub Packages into a clean project and asserts the consumer contract.
  registry-smoke:
    name: Registry smoke
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@blinkbitcoin'

      - name: Install the published packages (no Apollo)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          mkdir smoke && cd smoke
          npm init -y > /dev/null
          npm install "@blinkbitcoin/esign-core@$VERSION" > /dev/null
          # Forensics first: if the optional-peer contract regresses, explain it
          echo "--- npm $(npm -v) / node $(node -v)"
          echo "--- published manifest peer metadata:"
          node -p "JSON.stringify(require('@blinkbitcoin/esign-core/package.json').peerDependenciesMeta ?? 'MISSING')"
          echo "--- why is @apollo/client present (if it is):"
          npm why @apollo/client || echo "(not installed - as expected)"
          node -e "
            const assert = require('node:assert');
            const webform = require('@blinkbitcoin/esign-core/webform');
            assert.equal(typeof webform.createWebFormsSource, 'function');
            assert.equal(typeof webform.createPublicUrlSource, 'function');
            let apollo = false;
            try { require.resolve('@apollo/client'); apollo = true; } catch {}
            assert.equal(apollo, false, 'webform install must not pull Apollo');
            console.log('registry smoke passed for', process.env.VERSION);
          "

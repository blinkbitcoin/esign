name: E2E Web

on:
  push:
    branches-ignore: [main] # main is covered by the publish workflow's gates
    paths-ignore: ['docs/**', '**.md'] # docs-only pushes skip; PRs always run
  pull_request:
  workflow_call: # reused as a publish gate (see publish.yml)

permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run. Safe with the
# publish gates: publish.yml serializes itself per ref.
concurrency:
  group: e2e-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run migrations (test database)
        run: npm run migrate:test -w apps/api

      - name: Run browser E2E (Playwright starts backend + Vite)
        run: npm run test:e2e -w examples/react-demo

      - name: Stop test database
        if: always()
        run: docker compose -f docker-compose.test.yml down
